<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ระบบเบิก/คืนเครื่อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10.5 18.5h3"/></svg>เบิก/คืนเครื่อง</h1>
  <div class="r"><span id="role" class="badge" hidden></span><span id="net" class="badge ok">ออนไลน์</span>
    <button class="iconbtn" data-view="settings" aria-label="ตั้งค่า"><svg viewBox="0 0 24 24"><path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg></button></div>
</header>
<div class="hazard" aria-hidden="true"></div>
<div id="ticker" data-act="tickerGo" role="button" aria-label="ประกาศ — แตะเพื่อดูทั้งหมด" hidden></div>

<main id="app"></main>

<nav id="nav"></nav>

<dialog id="dlg"></dialog>

<dialog id="scanDlg" class="scan">
  <div class="vfwrap">
    <video id="scanVideo" playsinline muted></video>
    <div id="reader" hidden></div>
    <div class="vf" aria-hidden="true"><i class="sweep"></i></div>
  </div>
  <div id="scanMsg" class="scanMsg">กำลังเปิดกล้อง...</div>
  <button id="scanClose" class="primary">ปิดกล้อง</button>
</dialog>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
